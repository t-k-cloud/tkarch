services:
  sglang-server:
    image: lmsysorg/sglang:v0.5.10rc0-cu130
    restart: always
    ipc: host
    tty: true
    ports:
      - "30000:30000"
    volumes:
      - /mnt/hg_cache/huggingface:/root/.cache/huggingface
      - /mnt/asus_card:/mnt/asus_card
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all      # 这里改成了 all，自动映射宿主机的所有 GPU
              capabilities: [gpu]
    command: >
      python3 -m sglang.launch_server
        --host 0.0.0.0 --port 30000
        --tp 4 --mem-fraction-static 0.85
        --cuda-graph-max-bs 4
        --prefill-max-requests 4
        --chunked-prefill-size 2048
        --model-path Qwen/Qwen3.6-27B-FP8
        --reasoning-parser qwen3
        --tool-call-parser qwen3_coder
        --quantization fp8
        --kv-cache-dtype fp8_e4m3
        --context-length 128000
        --allow-auto-truncate
        --disable-fast-image-processor
        --mm-max-concurrent-calls 1
        --mm-process-config '{"image":{"max_pixels":40000}}'
